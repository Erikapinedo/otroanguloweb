    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #101943;
        background-image: url('/images/shared/fondo-oscuro-hero.webp');
        background-position: center top;
        background-repeat: repeat-x;
        background-size: 100vw;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .card {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 28px;
      }

      /* ── Logo ── */
      .logo-wrap {
        display: flex;
        justify-content: center;
      }
      .logo {
        width: 152px;
        height: auto;
        display: block;
      }

      /* ── Perfil ── */
      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .profile-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 2.5px solid #ff507d;
        flex-shrink: 0;
        display: block;
      }
      .profile-text { display: flex; flex-direction: column; gap: 3px; text-align: left; }
      .profile-name {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        line-height: 1.2;
      }
      .profile-role {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.4;
      }
      .profile-location {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.50);
        line-height: 1.4;
      }

      /* ── Botones ── */
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        display: flex;
        align-items: center;
        gap: 13px;
        /* min-height 44px para touch target WCAG 2.5.5 */
        min-height: 52px;
        padding: 14px 22px;
        border-radius: 100px;          /* pill – mismo estilo que la web */
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        transition: transform 0.14s ease, opacity 0.14s ease;
        -webkit-tap-highlight-color: transparent;
        /* WCAG 2.4.7: foco visible */
        outline: 2px solid transparent;
        outline-offset: 3px;
      }
      .btn:focus-visible {
        outline-color: #fff;
      }
      .btn:hover  { transform: translateY(-2px); opacity: 0.88; }
      .btn:active { transform: scale(0.97); }
      .btn svg { flex-shrink: 0; }

      /* blanco con texto azul #101943 → 15:1 ✓ WCAG AAA */
      .btn-pink { background: #fff; color: #101943; }

      /* #25d366 es claro → texto oscuro #0c2b14 → 7.9:1 ✓ WCAG AA */
      .btn-wa   { background: #25d366; color: #0c2b14; }

      /* blanco sobre fondo ~#1b2250 → >12:1 ✓ */
      .btn-dark {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
      }

      /* ── Pie ── */
      .foot {
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.28);
        letter-spacing: 0.04em;
      }
    </style>
