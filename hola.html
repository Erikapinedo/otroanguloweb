    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #101943;
        background-image: url('/images/shared/fondo-oscuro-hero.webp');
        background-position: center top;
        background-repeat: repeat-x;
        background-size: 100vw;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .card {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      /* ── Perfil ── */
      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #ff507d;
        display: block;
      }

      .logo {
        width: 160px;
        height: auto;
        display: block;
      }

      .profile-role {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.5;
      }

      /* ── Botones ── */
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      .btn {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 17px 22px;
        border-radius: 14px;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        color: #fff;
        transition: transform 0.14s ease, opacity 0.14s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover  { transform: translateY(-2px); opacity: 0.9; }
      .btn:active { transform: scale(0.97); }

      .btn svg { flex-shrink: 0; }

      .btn-pink  { background: #ff507d; }
      .btn-wa    { background: #25d366; }
      .btn-dark  {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      /* ── Footer ── */
      .foot {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.25);
        letter-spacing: 0.03em;
      }
    </style>
